<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reçaíbos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f6f6f6;
    --panel-2:#ececec;
    --line: rgba(0,0,0,0.09);
    --text:#1c1c1c;
    --muted:#6b6b6b;
    --gold:#d9791b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(242,161,62,0.08), transparent 40%),
                       radial-gradient(circle at 85% 100%, rgba(242,161,62,0.06), transparent 45%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    padding-bottom:60px;
  }
  .display{ font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .hero{
    max-width:1440px;
    margin:0 auto;
    padding:44px 24px 24px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .hero-logo{ width:120px; height:120px; border-radius:50%; margin:0 auto 16px; display:block; box-shadow:0 0 0 3px rgba(242,161,62,0.25); }
  .hero h1{ font-size:clamp(40px,8vw,72px); margin:0; line-height:0.95; }
  .hero p{ color:var(--muted); margin-top:10px; font-size:14px; font-family:'JetBrains Mono', monospace; letter-spacing:.05em; }

  .sofa-section{ max-width:1440px; margin:22px auto 0; padding:0 24px; }
  .sofa-title{
    font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); text-align:center; margin:0 0 14px;
  }

  .legend{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:10px;
  }
  .legend-chip{
    display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 10px; border-radius:100px;
    font-weight:700; font-size:12.5px; background:var(--panel); border:1px solid var(--line);
    cursor:pointer; user-select:none; text-align:center; transition:transform .15s ease, border-color .15s ease;
  }
  .legend-chip:hover{ transform:translateY(-2px); border-color:currentColor; }
  .legend-chip:active{ transform:translateY(0); }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  @media(max-width:900px){ .legend{ grid-template-columns:repeat(4,1fr); } }
  @media(max-width:560px){ .legend{ grid-template-columns:repeat(2,1fr); } .legend-chip{ font-size:12px; } }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(8,10,13,0.75); backdrop-filter:blur(2px);
    align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto;
  }
  .modal-overlay.active{ display:flex; }
  .modal-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; max-width:640px; width:100%;
    padding:28px; position:relative; margin-bottom:40px;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1;
  }
  .modal-name{ font-size:22px; font-weight:800; margin:0 0 4px; }
  .modal-sub{ color:var(--muted); font-size:12.5px; font-family:'JetBrains Mono',monospace; margin-bottom:20px; }
  .modal-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .modal-stat{ background:var(--panel-2); border-radius:10px; padding:12px 14px; }
  .modal-stat .k{ font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; letter-spacing:.06em; }
  .modal-stat .v{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; }
  .modal-section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 10px; font-family:'JetBrains Mono',monospace; }
  .modal-records{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .modal-rec{ background:var(--panel-2); border-radius:8px; padding:8px 10px; font-size:12px; display:flex; justify-content:space-between; gap:6px; }
  .modal-rec .rv{ font-family:'JetBrains Mono',monospace; color:var(--text); }
  .compare-row{ display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap; }
  .compare-row select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
    font-family:'JetBrains Mono',monospace; font-size:12.5px;
  }
  .compare-table{ margin-top:16px; background:var(--panel-2); border-radius:10px; overflow:hidden; }
  .compare-head, .compare-line{ display:grid; grid-template-columns:1.3fr 1fr 1fr; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--line); align-items:center; }
  .compare-head{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--muted); }
  .compare-line:last-child{ border-bottom:none; }
  .compare-val{ font-family:'JetBrains Mono',monospace; text-align:center; }
  .compare-val.win{ color:var(--gold); font-weight:700; }

  .tabs{ max-width:1440px; margin:28px auto 0; padding:0 24px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tab-btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--panel); border:1px solid var(--line);
    color:var(--muted); padding:10px 16px; border-radius:8px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--gold); color:#1a1508; border-color:var(--gold); font-weight:700; }

  .view{ display:none; max-width:1440px; margin:0 auto; padding:28px 24px 0; }
  .view.active{ display:block; }

  .totals-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px; }
  #totals-cards, #weeks-cards{ grid-template-columns:repeat(4, 1fr); }
  @media(max-width:820px){ #totals-cards, #weeks-cards{ grid-template-columns:repeat(2, 1fr); } }
  @media(max-width:460px){ #totals-cards, #weeks-cards{ grid-template-columns:repeat(1, 1fr); } }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 12px; }
  .stat-card .metric-label{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:10px; white-space:nowrap;
  }
  .stat-row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; gap:6px; }
  .stat-row .name{
    display:flex; align-items:center; font-size:11.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .stat-row .val{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--text);
    white-space:nowrap; flex-shrink:0;
  }
  .stat-row.leader .val{ color:var(--gold); }
  .stat-row{ cursor:pointer; }
  .rank{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--muted);
    min-width:16px; display:inline-block; text-align:right; flex-shrink:0; margin-right:3px;
  }
  .stat-row.leader .rank{ color:var(--gold); font-weight:700; }

  .chart-controls{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .metric-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--panel); border:1px solid var(--line);
    color:var(--muted); padding:7px 14px; border-radius:100px; cursor:pointer;
  }
  .metric-btn.active{ background:var(--panel-2); color:var(--text); border-color:var(--text); }

  .chart-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .year-bars{ display:flex; flex-direction:column; gap:11px; }
  .year-bar-row{ display:grid; grid-template-columns:150px 1fr 92px; align-items:center; gap:12px; }
  .year-bar-name{
    font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .year-bar-track{ background:var(--panel-2); border-radius:6px; height:24px; overflow:hidden; }
  .year-bar-fill{ height:100%; border-radius:6px; min-width:2px; transition:width .3s ease; }
  .year-bar-val{ font-family:'JetBrains Mono',monospace; font-size:12.5px; text-align:right; color:var(--text); }
  @media(max-width:560px){ .year-bar-row{ grid-template-columns:92px 1fr 78px; gap:8px; } .year-bar-name{ font-size:11.5px; } }
  .chart{ display:flex; align-items:flex-end; gap:14px; height:280px; padding:0 4px; min-width:640px; }
  .year-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .bars{ display:flex; gap:3px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
  .bar{ width:14px; border-radius:4px 4px 0 0; position:relative; transition:height .3s ease; min-height:2px; }
  .bar .tip{
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--muted); white-space:nowrap; margin-bottom:3px;
  }
  .year-label{ margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }

  .records-table{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; overflow-x:auto; padding:0; }
  .rec-row{ display:grid; align-items:stretch; border-bottom:1px solid var(--line); font-size:13.5px; }
  .rec-row:last-child{ border-bottom:none; }
  .rec-row.head{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
    letter-spacing:.02em; background:var(--panel-2); align-items:end;
  }
  .rec-row > div{ padding:14px 10px; border-right:1px solid var(--line); display:flex; align-items:center; }
  .rec-row > div:last-child{ border-right:none; }
  .rec-label{ font-weight:700; font-size:14px; line-height:1.25; padding-left:16px !important; text-align:left; background:var(--panel-2); }
  .rec-row.head .rec-label{ visibility:hidden; }
  .rec-row:not(.head):nth-child(even) .rec-label{ background:var(--panel); }
  .rec-name{
    flex-direction:column; justify-content:flex-end; width:100%;
    text-align:center; font-weight:700; font-size:13px; line-height:1.3; gap:0; padding-bottom:12px !important;
  }
  .rec-name span{ display:block; }
  .rec-val{ font-family:'JetBrains Mono',monospace; font-size:13.5px; white-space:nowrap; width:100%; justify-content:center; }
  .rec-val.winner{ font-weight:800; }
  .rec-row:not(.head):hover > div{ background:var(--panel-2); }

  .insight-box{
    margin-top:18px; background:var(--panel-2); border:1px solid var(--gold); border-radius:12px;
    padding:16px 20px; font-size:13.5px; color:var(--text);
  }
  .insight-box b{ color:var(--gold); }

  .weeks-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:14px; margin-top:6px; }

  .alert-card{
    background:var(--panel); border-radius:14px; padding:18px 20px;
    border:1px solid var(--line); border-left:4px solid var(--rc, var(--gold));
  }
  .alert-card .a-name{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .alert-card .a-tag{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; padding:2px 8px; border-radius:100px; margin-bottom:8px;
  }
  .alert-card .a-tag.parado{ background:rgba(248,113,113,0.15); color:#f87171; }
  .alert-card .a-tag.queda{ background:rgba(242,193,78,0.15); color:var(--gold); }
  .alert-card .a-tag.aposentado{ background:rgba(139,149,161,0.18); color:var(--muted); }
  .alert-card .a-desc{ font-size:13px; color:var(--muted); line-height:1.5; }

  footer{
    max-width:1440px; margin:40px auto 0; padding:20px 24px 0; text-align:center;
    color:var(--muted); font-size:12px; border-top:1px solid var(--line);
  }

  @media(max-width:600px){ .bar{ width:10px; } .chart{ gap:6px; } }
</style>
</head>

<div class="hero">
  <img src="logo.jpg" alt="Logo Reçaíbos MTB Unaí-MG" class="hero-logo">
  <h1 class="display">REÇAÍBOS NO SOFÁ</h1>
  <p>Fonte: Strava</p>
</div>

<div class="sofa-section">
  <div class="legend" id="legend"></div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-view="totais">Totais da Carreira</button>
  <button class="tab-btn" data-view="anos">Ano a Ano</button>
  <button class="tab-btn" data-view="recordes">Recordes</button>
  <button class="tab-btn" data-view="semanas">Últimas 4 Semanas</button>
  <button class="tab-btn" data-view="alertas">⚠️ Alertas</button>
</div>

<div class="view active" id="view-totais">
  <div class="totals-grid" id="totals-cards"></div>
  <div class="insight-box" id="totals-insight"></div>
</div>

<div class="view" id="view-anos">
  <div class="chart-controls" id="year-controls"></div>
  <div class="chart-controls" id="metric-controls"></div>
  <div class="chart-wrap"><div class="year-bars" id="chart-container"></div></div>
  <div class="insight-box" id="anos-insight"></div>
</div>

<div class="view" id="view-recordes">
  <div class="records-table" id="records-container"></div>
  <div class="insight-box" id="records-insight"></div>
</div>

<div class="view" id="view-semanas">
  <div class="weeks-grid" id="weeks-cards"></div>
</div>

<div class="view" id="view-alertas">
  <div class="totals-grid" id="alerts-cards"></div>
  <div class="insight-box" id="alerts-empty" style="display:none;">✅ Ninguém do grupo está com queda relevante ou parado no momento — geral pedalando normal.</div>
</div>

<footer>Fonte: Strava · Reçaíbos 🚴</footer>

<div class="modal-overlay" id="rider-modal">
  <div class="modal-panel">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

function fmtKm(v){ return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' km'; }
function fmtM(v){ return Math.round(v).toLocaleString('pt-BR') + ' m'; }
function fmtInt(v){ return v.toLocaleString('pt-BR'); }
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function parseNum(str){ return parseFloat(str.replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',', '.')); }
function parseTimeToSeconds(str){
  const parts = str.split(':').map(Number);
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return NaN;
}

const ALL_YEARS = Array.from(new Set(RIDERS.flatMap(r => Object.keys(r.years).map(Number)))).sort((a,b)=>a-b);

  return rider.name;
}

function renderLegend(){
  const sorted = [...RIDERS].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  document.getElementById('legend').innerHTML = sorted.map(r =>
    `<div class="legend-chip" style="color:${r.color}" data-rider="${r.id}"><span class="dot" style="background:${r.color}"></span>${r.name}</div>`
  ).join('');
  document.querySelectorAll('#legend .legend-chip').forEach(chip=>{
    chip.addEventListener('click', ()=> openRiderModal(chip.dataset.rider));
  });
}

// ---------- Modal: detalhes do ciclista + comparação ----------
let modalCompareId = null;

function findRider(id){ return RIDERS.find(r=>r.id===id); }

function openRiderModal(id){
  modalCompareId = null;
  renderModalContent(id);
  document.getElementById('rider-modal').classList.add('active');
}

function closeModal(){
  document.getElementById('rider-modal').classList.remove('active');
}

function fmtCompareVal(label, v){
  if(label === 'Distância (km)') return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  if(label === 'Tempo (h)') return v.toFixed(1)+'h';
  return fmtInt(Math.round(v));
}

function renderModalContent(id){
  const r = findRider(id);
  if(!r) return;

  const otherRiders = RIDERS.filter(x=>x.id!==id).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const compareOptions = otherRiders.map(o=>
    `<option value="${o.id}" ${modalCompareId===o.id?'selected':''}>${o.name}</option>`
  ).join('');

  const recordsHtml = RECORD_CATEGORIES.map(cat=>{
    const val = r.records[cat];
    return `<div class="modal-rec"><span>${cat}</span><span class="rv">${val || '—'}</span></div>`;
  }).join('');

  let compareHtml = '';
  if(modalCompareId){
    const c = findRider(modalCompareId);
    const rows = [
      {label:'Atividades', a:r.totals.ativ, b:c.totals.ativ},
      {label:'Distância (km)', a:r.totals.dist, b:c.totals.dist},
      {label:'Elevação (m)', a:r.totals.elev, b:c.totals.elev},
      {label:'Tempo (h)', a:r.totals.tempoH, b:c.totals.tempoH},
    ];
    compareHtml = `
      <div class="compare-table">
        <div class="compare-head"><div>Métrica</div><div style="text-align:center">${shortName(r)}</div><div style="text-align:center">${shortName(c)}</div></div>
        ${rows.map(row=>{
          const aWin = row.a > row.b, bWin = row.b > row.a;
          return `<div class="compare-line">
            <div>${row.label}</div>
            <div class="compare-val ${aWin?'win':''}">${fmtCompareVal(row.label,row.a)}</div>
            <div class="compare-val ${bWin?'win':''}">${fmtCompareVal(row.label,row.b)}</div>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  document.getElementById('modal-body').innerHTML = `
    <h3 class="modal-name" style="color:${r.color}">${r.name}</h3>
    <div class="modal-sub">${r.retired ? 'Ex-Ciclista · ' : ''}Carreira desde ${Math.min(...Object.keys(r.years).map(Number))}</div>

    <div class="modal-section-title">Totais da carreira</div>
    <div class="modal-grid">
      <div class="modal-stat"><div class="k">Atividades</div><div class="v">${fmtInt(r.totals.ativ)}</div></div>
      <div class="modal-stat"><div class="k">Distância</div><div class="v">${fmtKm(r.totals.dist)}</div></div>
      <div class="modal-stat"><div class="k">Elevação</div><div class="v">${fmtM(r.totals.elev)}</div></div>
      <div class="modal-stat"><div class="k">Tempo</div><div class="v">${r.totals.tempoLabel}</div></div>
    </div>

    <div class="modal-section-title">Últimas 4 semanas</div>
    <div class="modal-grid">
      <div class="modal-stat"><div class="k">Ativ/semana</div><div class="v">${r.last4.ativSem}</div></div>
      <div class="modal-stat"><div class="k">Dist/semana</div><div class="v">${r.last4.distSem.toFixed(1)} km</div></div>
      <div class="modal-stat"><div class="k">Elev/semana</div><div class="v">${r.last4.elevSem} m</div></div>
      <div class="modal-stat"><div class="k">Tempo/semana</div><div class="v">${r.last4.tempoSem}</div></div>
    </div>

    <div class="modal-section-title">Melhores marcas</div>
    <div class="modal-records">${recordsHtml}</div>

    <div class="compare-row">
      <span style="font-size:12.5px;color:var(--muted)">🆚 Comparar com:</span>
      <select id="compare-select">
        <option value="">Selecione...</option>
        ${compareOptions}
      </select>
    </div>
    ${compareHtml}
  `;

  document.getElementById('compare-select').addEventListener('change', (e)=>{
    modalCompareId = e.target.value || null;
    renderModalContent(id);
  });
}

function renderTotals(){
  const el = document.getElementById('totals-cards');
  const metrics = [
    {key:'ativ', label:'Atividades', fmt:fmtInt},
    {key:'dist', label:'Distância total', fmt:fmtKm},
    {key:'elev', label:'Ganho de elevação', fmt:fmtM},
    {key:'tempoLabel', label:'Tempo total', fmt:(v)=>v, sortKey:'tempoH'}
  ];
  el.innerHTML = metrics.map(m=>{
    const sortKey = m.sortKey || m.key;
    const sorted = [...RIDERS].sort((a,b) => b.totals[sortKey] - a.totals[sortKey]);
    const rows = sorted.map((r,i) => `
      <div class="stat-row ${i===0?'leader':''}" data-rider="${r.id}">
        <div class="name" style="color:${r.color}"><span class="rank">${i+1}º</span>${shortName(r)}</div>
        <div class="val">${m.fmt(r.totals[m.key])}</div>
      </div>
    `).join('');
    return `<div class="stat-card"><div class="metric-label">${m.label}</div>${rows}</div>`;
  }).join('');

  el.querySelectorAll('.stat-row').forEach(row=>{
    row.addEventListener('click', ()=> openRiderModal(row.dataset.rider));
  });

  const distLeader = [...RIDERS].sort((a,b)=>b.totals.dist - a.totals.dist)[0];
  document.getElementById('totals-insight').innerHTML =
    `🏆 <b>${distLeader.name}</b> lidera em distância total de carreira entre os Reçaíbos. Confira a aba "Recordes" pra ver quem manda em cada tipo de prova.`;
}

];

function renderYearControls(){
  const el = document.getElementById('year-controls');
  el.innerHTML = ALL_YEARS.map(y => `<button class="metric-btn ${y===currentYear?'active':''}" data-year="${y}">${y}</button>`).join('');
  el.querySelectorAll('.metric-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentYear = Number(btn.dataset.year); renderYearControls(); renderChart(); });
  });
}

function renderMetricControls(){
  const el = document.getElementById('metric-controls');
  el.innerHTML = METRIC_DEFS.map(m => `<button class="metric-btn ${m.key===currentMetric?'active':''}" data-metric="${m.key}">${m.label}</button>`).join('');
  el.querySelectorAll('.metric-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentMetric = btn.dataset.metric; renderMetricControls(); renderChart(); });
  });
}

function valueFor(rider, year, key){ const y = rider.years[year]; if(!y) return 0; return y[key] || 0; }
function labelFor(rider, year, key){
  const y = rider.years[year]; if(!y) return '—';
  if(key==='tempoH') return y.tempoLabel;
  if(key==='dist') return fmtKm(y.dist);
  if(key==='elev') return fmtM(y.elev);
  return fmtInt(y.ativ);
}

function renderChart(){
  const container = document.getElementById('chart-container');
  const rows = RIDERS
    .map(r => ({ r, v: valueFor(r, currentYear, currentMetric) }))
    .sort((a,b)=> b.v - a.v);
  const maxVal = Math.max(...rows.map(x=>x.v)) || 1;

  container.innerHTML = rows.map(({r,v})=>{
    const pct = v>0 ? Math.max((v/maxVal*100), 2) : 0;
    const label = v>0 ? labelFor(r, currentYear, currentMetric) : '—';
    return `
      <div class="year-bar-row" data-rider="${r.id}">
        <div class="year-bar-name" style="color:${r.color}">${shortName(r)}</div>
        <div class="year-bar-track"><div class="year-bar-fill" style="width:${pct}%; background:${r.color}"></div></div>
        <div class="year-bar-val">${label}</div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.year-bar-row').forEach(row=>{
    row.style.cursor = 'pointer';
    row.addEventListener('click', ()=> openRiderModal(row.dataset.rider));
  });

  const top = rows[0];
  const metricLabel = METRIC_DEFS.find(m=>m.key===currentMetric).label.split(' (')[0].toLowerCase();
  document.getElementById('anos-insight').innerHTML = (top && top.v > 0)
    ? `🏆 Em <b>${currentYear}</b>, <b style="color:${top.r.color}">${top.r.name}</b> liderou em ${metricLabel}.`
    : `Nenhum dado registrado para ${currentYear}.`;
}

function splitName(name){
  const parts = name.split(' ');
  return { first: parts[0], rest: parts.slice(1).join(' ') };
}

function renderRecords(){
  const el = document.getElementById('records-container');
  const sortedRiders = [...RIDERS].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const cols = `92px repeat(${sortedRiders.length}, minmax(0,1fr))`;
  let head = `<div class="rec-row head" style="grid-template-columns:${cols}"><div class="rec-label">Categoria</div>${sortedRiders.map(r=>{
    const {first, rest} = splitName(r.name);
    return `<div class="rec-name" style="color:${r.color}"><span>${first}</span>${rest ? `<span>${rest}</span>` : ''}</div>`;
  }).join('')}</div>`;

  const wins = {}; sortedRiders.forEach(r => wins[r.id] = 0);

  let rows = RECORD_CATEGORIES.map(cat=>{
    const higherBetter = HIGHER_IS_BETTER.includes(cat);
    let bestVal = higherBetter ? -Infinity : Infinity;
    let bestId = null;
    sortedRiders.forEach(r=>{
      const raw = r.records[cat];
      if(!raw) return;
      const val = higherBetter ? parseNum(raw) : parseTimeToSeconds(raw);
      if(higherBetter ? val > bestVal : val < bestVal){ bestVal = val; bestId = r.id; }
    });
    if(bestId) wins[bestId]++;
    const cells = sortedRiders.map(r=>{
      const raw = r.records[cat];
      const isWinner = r.id === bestId;
      const style = isWinner ? `background:${hexToRgba(r.color,0.15)}; color:${r.color};` : '';
      return `<div class="rec-val ${isWinner?'winner':''}" style="${style}">${raw || '—'}</div>`;
    }).join('');
    return `<div class="rec-row" style="grid-template-columns:${cols}"><div class="rec-label">${cat}</div>${cells}</div>`;
  }).join('');

  el.innerHTML = head + rows;

  const placar = sortedRiders.map(r => `${shortName(r)}: <b style="color:${r.color}">${wins[r.id]}</b>`).join(' · ');
  document.getElementById('records-insight').innerHTML = `📊 Placar de recordes — ${placar}.`;
}

function parseWeeklyTimeToSeconds(str){
  if(!str) return 0;
  let h=0, m=0, s=0;
  const hM = str.match(/(\d+)\s*h/); if(hM) h = parseInt(hM[1]);
  const mM = str.match(/(\d+)\s*min/); if(mM) m = parseInt(mM[1]);
  const sM = str.match(/(\d+)\s*s/); if(sM) s = parseInt(sM[1]);
  return h*3600 + m*60 + s;
}

function renderWeeks(){
  const el = document.getElementById('weeks-cards');
  const metrics = [
    {label:'Atividades/semana', key:'ativSem', fmt:(v)=>v, sortVal:(r)=>r.last4.ativSem},
    {label:'Distância média/semana', key:'distSem', fmt:(v)=>v.toFixed(1)+' km', sortVal:(r)=>r.last4.distSem},
    {label:'Ganho de elevação/semana', key:'elevSem', fmt:(v)=>v+' m', sortVal:(r)=>r.last4.elevSem},
    {label:'Tempo médio/semana', key:'tempoSem', fmt:(v)=>v, sortVal:(r)=>parseWeeklyTimeToSeconds(r.last4.tempoSem)},
  ];
  el.innerHTML = metrics.map(m=>{
    const sorted = [...RIDERS].sort((a,b)=> m.sortVal(b) - m.sortVal(a));
    const rows = sorted.map((r,i)=>`
      <div class="stat-row ${i===0 ? 'leader':''}" data-rider="${r.id}">
        <div class="name" style="color:${r.color}"><span class="rank">${i+1}º</span>${shortName(r)}</div>
        <div class="val">${m.fmt(r.last4[m.key])}</div>
      </div>
    `).join('');
    return `<div class="stat-card"><div class="metric-label">${m.label}</div>${rows}</div>`;
  }).join('');

  el.querySelectorAll('.stat-row').forEach(row=>{
    row.addEventListener('click', ()=> openRiderModal(row.dataset.rider));
  });
}

function lastActiveYear(r){
  const years = Object.keys(r.years).map(Number).filter(y => (r.years[y].ativ || 0) > 0);
  return years.length ? Math.max(...years) : null;
}

function renderAlerts(){
  const el = document.getElementById('alerts-cards');
  const emptyMsg = document.getElementById('alerts-empty');
  const currentYear = Math.max(...ALL_YEARS);

  const alerts = [];
  RIDERS.forEach(r=>{
    if(r.retired){
      alerts.push({ rider:r, tag:'aposentado', desc:'Aposentado.' });
      return;
    }
    const histYears = Object.keys(r.years).map(Number).filter(y => y !== currentYear);
    if(histYears.length === 0) return;
    const histAvgWeekly = histYears.reduce((sum,y) => sum + r.years[y].dist, 0) / histYears.length / 52;
    const currentWeekly = r.last4.distSem;
    const ratio = histAvgWeekly > 0 ? currentWeekly / histAvgWeekly : null;

    if(r.last4.ativSem === 0){
      alerts.push({
        rider:r, tag:'parado',
        desc:`0 atividades nas últimas 4 semanas. Média histórica de ritmo: ~${histAvgWeekly.toFixed(1)} km/semana.`
      });
    } else if(ratio !== null && ratio < 0.5){
      const queda = Math.round((1-ratio)*100);
      alerts.push({
        rider:r, tag:'queda', quedaPct:queda,
        desc:`Queda de ~${queda}% no ritmo: média histórica ~${histAvgWeekly.toFixed(1)} km/semana → atual ${currentWeekly.toFixed(1)} km/semana.`
      });
    }
  });

  // Ordena por tempo sem pedalar: anos completos desde a última atividade registrada,
  // depois "parado" antes de "queda", e dentro de "queda" pela maior queda percentual.
  alerts.forEach(a=>{
    const lay = lastActiveYear(a.rider);
    a.yearsStopped = lay === null ? 99 : currentYear - lay;
  });
  const tagRank = t => t === 'aposentado' ? 0 : t === 'parado' ? 1 : 2;
  alerts.sort((a,b)=>{
    if(a.yearsStopped !== b.yearsStopped) return b.yearsStopped - a.yearsStopped;
    if(tagRank(a.tag) !== tagRank(b.tag)) return tagRank(a.tag) - tagRank(b.tag);
    if(a.tag === 'queda' && b.tag === 'queda') return b.quedaPct - a.quedaPct;
    return 0;
  });

  if(alerts.length === 0){
    el.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  el.innerHTML = alerts.map(a => `
    <div class="alert-card" style="--rc:${a.rider.color}" data-rider="${a.rider.id}">
      <div class="a-name" style="color:${a.rider.color}">${a.rider.name}</div>
      <div class="a-tag ${a.tag}">${a.tag === 'parado' ? '⏸ Parado' : a.tag === 'aposentado' ? '🚪 Ex-Ciclista' : '📉 Queda forte'}</div>
      <div class="a-desc">${a.desc}</div>
    </div>
  `).join('');

  el.querySelectorAll('.alert-card').forEach(card=>{
    card.style.cursor = 'pointer';
    card.addEventListener('click', ()=> openRiderModal(card.dataset.rider));
  });
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

renderLegend();
renderTotals();
renderYearControls();
renderMetricControls();
renderChart();
renderRecords();
renderWeeks();
renderAlerts();
</script>
